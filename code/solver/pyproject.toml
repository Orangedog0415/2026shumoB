[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cumcm-b-solver"
version = "1.0.0"
description = "2026 CUMCM problem B offline solver and official HTTP client"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
bsolver = "bsolver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bsolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
